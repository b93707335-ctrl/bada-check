<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0077b6" />
  <title>바다체크 | 바다도 체크하고, 안전도 체크!</title>
  <link rel="stylesheet" href="css/style.css?v=20260729-7" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">BADA CHECK</p>
        <h1>🌊 바다체크</h1>
        <p class="tagline">바다도 체크하고, 안전도 체크!</p>
      </div>
      <button id="favoriteBtn" class="icon-button" aria-label="즐겨찾기">☆</button>
    </header>

    <main>
      <section id="homeView" class="view active">
        <div class="notice">현재 화면에는 시연용 데이터가 포함되어 있습니다.</div>

        <section class="search-section card">
          <label for="beachSearch">가고 싶은 물놀이 장소를 검색하세요.</label>
          <div class="search-row">
            <input id="beachSearch" type="search" placeholder="예: 해운대해수욕장, 대천천 애기소" autocomplete="off" />
            <button id="locationBtn" class="secondary-button">내 주변</button>
          </div>
          <div id="autocomplete" class="autocomplete hidden"></div>
        </section>

        <section class="hero-card">
          <div>
            <p id="beachLocation" class="muted"></p>
            <h2 id="beachName"></h2>
            <p id="updatedAt" class="muted"></p>
          </div>
          <div class="score-ring" id="overallScoreRing">
            <strong id="overallScore">-</strong>
            <span>종합점수</span>
          </div>
          <div id="overallGrade" class="grade-pill">-</div>
          <p id="overallReason" class="reason"></p>
        </section>

        <section class="category-grid" id="categoryGrid"></section>

        <section class="card">
          <div class="section-title-row">
            <h3 id="metricTitle">수질 세부 점수</h3>
            <span id="metricHint" class="muted">카드를 눌러 세부 수치를 확인하세요</span>
          </div>
          <div id="metricGrid" class="metric-grid"></div>
        </section>

        <section class="card">
          <h3>안전 안내</h3>
          <p id="actionGuide"></p>
          <p class="source" id="dataSource"></p>
        </section>

      <section id="historyView" class="view">
        <h2>최근 확인 기록</h2>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-button active" data-target="homeView">🏠<span>홈</span></button>
      <button class="nav-button" data-target="homeView">🛟<span>바다 안전</span></button>
      <button class="nav-button" data-target="historyView">🕘<span>기록</span></button>
    </nav>

    <footer>
      바다체크의 정보는 참고용입니다. 실제 물놀이 전 현장 통제, 기상특보 및 안전요원의 안내를 반드시 확인하세요.
    </footer>
  </div>

  <script src="js/data.js?v=20260729-7"></script>
  <script src="js/scoring.js?v=20260729-7"></script>
  <script src="js/app.js?v=20260729-7"></script>
</body>
</html>
